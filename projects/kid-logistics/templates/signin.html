{% extends "base.html" %}
{% block content %}
<h1>Kid Logistics</h1>
<p class="sub">Sign in to see this week.</p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/signin" class="card">
  <label for="name">Name</label>
  <input type="text" id="name" name="name" autocomplete="username" autofocus required>
  <label for="passcode">Passcode</label>
  <input type="password" id="passcode" name="passcode" autocomplete="current-password" required>
  <div class="btns"><button class="btn" type="submit">Sign in</button></div>
</form>
{% endblock %}
